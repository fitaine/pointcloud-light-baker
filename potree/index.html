<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Point Cloud — Potree</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">

  <!-- ── Potree 1.8.2 — exact deps from examples/copc.html ── -->
  <link rel="stylesheet" href="Potree_1.8.2/build/potree/potree.css">
  <link rel="stylesheet" href="Potree_1.8.2/libs/jquery-ui/jquery-ui.min.css">
  <link rel="stylesheet" href="Potree_1.8.2/libs/openlayers3/ol.css">
  <link rel="stylesheet" href="Potree_1.8.2/libs/spectrum/spectrum.css">
  <link rel="stylesheet" href="Potree_1.8.2/libs/jstree/themes/mixed/style.css">
  <script src="Potree_1.8.2/libs/jquery/jquery-3.1.1.min.js"></script>
  <script src="Potree_1.8.2/libs/spectrum/spectrum.js"></script>
  <script src="Potree_1.8.2/libs/jquery-ui/jquery-ui.min.js"></script>
  <script src="Potree_1.8.2/libs/other/BinaryHeap.js"></script>
  <script src="Potree_1.8.2/libs/tween/tween.min.js"></script>
  <script src="Potree_1.8.2/libs/d3/d3.js"></script>
  <script src="Potree_1.8.2/libs/proj4/proj4.js"></script>
  <script src="Potree_1.8.2/libs/openlayers3/ol.js"></script>
  <script src="Potree_1.8.2/libs/i18next/i18next.js"></script>
  <script src="Potree_1.8.2/libs/jstree/jstree.js"></script>
  <!-- three.js r124 as global — same version Potree bundles, needed for volume shader code -->
  <script src="Potree_1.8.2/libs/three.js/build/three.min.js"></script>
  <script src="Potree_1.8.2/libs/copc/index.js"></script>
  <script src="Potree_1.8.2/build/potree/potree.js"></script>
  <!-- NOTE: three.js r124 must be loaded before potree.js so window.THREE is defined -->
  <!-- laslaz.js must come AFTER potree.js — needed for LAZ decompression in COPC -->
  <script src="Potree_1.8.2/libs/plasio/js/laslaz.js"></script>

  <style>
    /* ── Reset ─────────────────────────────────────────────────────────── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #030405; }

    /* ── Hide Potree sidebar + fix canvas ──────────────────────────────── */
    #potree_sidebar_container         { display: none !important; }
    .potree_container                 { background: transparent !important; }
    #potree_render_area               { position: fixed; inset: 0; z-index: 1; }
    #potree_render_area canvas        { cursor: crosshair !important; display: block; }

    /* ── Loading ────────────────────────────────────────────────────────── */
    #loading {
      position: fixed; inset: 0; z-index: 200;
      display: flex; align-items: center; justify-content: center;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
      color: rgba(200,240,224,.45);
      background: #030405;
      transition: opacity .6s ease;
    }
    #loading.fade { opacity: 0; pointer-events: none; }

    /* ── 2D / 3D dimension switch — top right (matches the 2D viewer) ─────── */
    #dim-switch {
      position: fixed; top: 18px; right: 24px; z-index: 61;
      display: inline-flex; border: 1px solid rgba(200,240,224,.16);
      background: rgba(7,10,12,.6);
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    }
    .dim-seg {
      background: none; border: 0;
      font-family: 'IBM Plex Mono', monospace; font-size: 9.5px;
      letter-spacing: .16em; text-transform: uppercase; color: rgba(200,240,224,.55);
      padding: 7px 13px; cursor: crosshair; transition: color .15s, background .15s;
    }
    .dim-seg + .dim-seg { border-left: 1px solid rgba(200,240,224,.16); }
    .dim-seg:hover { color: #c8f0e0; }
    .dim-seg.active { color: #06080a; background: #c8f0e0; cursor: default; }

    /* ── Badge ──────────────────────────────────────────────────────────── */
    #badge {
      position: fixed; top: 20px; left: 24px; z-index: 50;
      font-family: 'IBM Plex Mono', monospace; font-size: 9px;
      letter-spacing: .16em; text-transform: uppercase;
      color: rgba(200,240,224,.25); pointer-events: none;
    }

    /* ── Controls — bottom left ─────────────────────────────────────────── */
    #ui {
      position: fixed; bottom: 24px; left: 24px; z-index: 50;
      display: none; flex-direction: column; gap: 10px;
      font-family: 'IBM Plex Mono', monospace; font-size: 10px;
      letter-spacing: .12em; color: rgba(200,240,224,.65);
    }
    #ui.visible { display: flex; }

    .row { display: flex; align-items: center; gap: 12px; }
    .lbl { width: 72px; text-transform: uppercase; opacity: .5; font-size: 9px; }
    .val { width: 24px; opacity: .6; font-size: 9px; }

    input[type=range] {
      width: 100px; accent-color: #c8f0e0; cursor: crosshair;
      -webkit-appearance: none; height: 2px; background: rgba(200,240,224,.15);
      border-radius: 1px; outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 10px; height: 10px;
      background: #c8f0e0; border-radius: 50%; cursor: crosshair;
    }

    button {
      background: none;
      border: 1px solid rgba(200,240,224,.18);
      color: rgba(200,240,224,.65);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
      padding: 5px 14px; cursor: crosshair; align-self: flex-start;
      transition: border-color .15s, color .15s, background .15s;
    }
    button:hover {
      border-color: rgba(200,240,224,.55);
      color: rgba(200,240,224,.9);
    }
    button.active {
      border-color: rgba(200,240,224,.45);
      color: rgba(200,240,224,.95);
      background: rgba(200,240,224,.06);
    }

    /* ── Scene menu — top right ─────────────────────────────────────────── */
    #scene-nav {
      position: fixed; top: 58px; right: 24px; z-index: 60;
      font-family: 'IBM Plex Mono', monospace;
    }
    /* Collapsed pill */
    #scene-pill {
      display: none; align-items: center; gap: 7px;
      background: rgba(7,10,12,.9); border: 1px solid rgba(200,240,224,.16);
      color: rgba(200,240,224,.65);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase;
      padding: 7px 12px; cursor: crosshair;
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
      transition: border-color .15s, color .15s;
    }
    #scene-pill:hover { border-color: rgba(200,240,224,.5); color: rgba(200,240,224,.95); }
    #scene-pill .ct { color: #c8f0e0; }
    #scene-nav.collapsed #scene-pill { display: inline-flex; }
    #scene-nav.collapsed #scene-panel { display: none; }
    /* Expanded panel */
    #scene-panel {
      width: 250px; background: rgba(7,10,12,.92);
      border: 1px solid rgba(200,240,224,.14);
      -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    }
    .sm-head {
      display: flex; align-items: center; gap: 8px;
      padding: 11px 12px; border-bottom: 1px solid rgba(200,240,224,.1);
    }
    .sm-head .lbl { font-size: 9px; letter-spacing: .18em; text-transform: uppercase; color: rgba(200,240,224,.45); }
    .sm-head .cnt { margin-left: auto; font-size: 8.5px; letter-spacing: .12em; color: rgba(200,240,224,.32); }
    .sm-head .cnt b { color: #c8f0e0; font-weight: 400; }
    .sm-close { background: none; border: 0; color: rgba(200,240,224,.4); cursor: crosshair; font-size: 13px; line-height: 1; padding: 0 2px; }
    .sm-close:hover { color: rgba(200,240,224,.9); }
    .sm-row {
      display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
      background: none; border: 0; border-left: 2px solid transparent;
      padding: 9px 10px 9px 12px; cursor: crosshair;
      font-family: 'IBM Plex Mono', monospace;
      transition: background .15s, border-color .15s;
    }
    .sm-row:hover { background: rgba(200,240,224,.05); }
    .sm-row.current { background: rgba(200,240,224,.07); border-left-color: #c8f0e0; cursor: default; }
    .sm-idx { font-size: 11px; letter-spacing: .1em; color: rgba(200,240,224,.32); width: 16px; flex: none; }
    .sm-name { font-size: 12px; letter-spacing: .08em; color: rgba(200,240,224,.62); text-transform: uppercase; display: block; }
    .sm-row.current .sm-name { color: #c8f0e0; }
    .sm-row:hover .sm-name { color: rgba(200,240,224,.9); }
    .sm-sub { font-size: 9.5px; letter-spacing: .06em; color: rgba(200,240,224,.3); text-transform: uppercase; display: block; margin-top: 2px; }
    .sm-tag { margin-left: auto; font-size: 8.5px; letter-spacing: .14em; color: rgba(200,240,224,.4); display: flex; align-items: center; gap: 4px; flex: none; }
    .sm-row:not(.current) .sm-tag { opacity: 0; transition: opacity .15s; }
    .sm-row:not(.current):hover .sm-tag { opacity: .55; }
    .sm-divider { height: 1px; background: rgba(200,240,224,.08); margin: 4px 12px; }
    .sm-soon {
      display: flex; align-items: center; gap: 11px;
      padding: 9px 10px 9px 12px; border-left: 2px solid transparent;
      opacity: .42; cursor: not-allowed;
    }
    .sm-soon .bar { height: 7px; border-radius: 2px; background: rgba(200,240,224,.14); flex: 1; }
    .sm-soon .sm-tag { margin-left: 10px; flex: none; }
    .sm-foot {
      padding: 9px 12px 11px; border-top: 1px solid rgba(200,240,224,.08);
      font-size: 8.5px; letter-spacing: .12em; text-transform: uppercase; color: rgba(200,240,224,.28);
    }
    @media (max-width: 767px) {
      #dim-switch { top: 12px; right: 12px; }
      #scene-nav { top: 50px; right: 12px; }
      #scene-panel { width: calc(100vw - 24px); max-width: 280px; }
      /* Mobile: keep only the point count, drop fps + scene name. Lift it above
         the drift toggle (bottom-right corner) so they don't overlap. */
      #telemetry { bottom: 56px !important; right: 14px !important; }
      #telemetry #fps-line, #telemetry #scene-line { display: none; }
    }

    /* ── Telemetry — bottom right ───────────────────────────────────────── */
    #telemetry {
      position: fixed; bottom: 24px; right: 24px; z-index: 50;
      display: none;
      font-family: 'IBM Plex Mono', monospace; font-size: 9px;
      letter-spacing: .10em; color: rgba(200,240,224,.28);
      text-align: right; pointer-events: none; line-height: 1.9;
    }
    #telemetry.visible { display: block; }
  </style>
</head>
<body>

  <div id="loading"></div>
  <div id="dim-switch" role="group" aria-label="2D / 3D viewer">
    <button class="dim-seg" data-dim="2d" aria-pressed="false">2D</button>
    <button class="dim-seg active" data-dim="3d" aria-pressed="true">3D</button>
  </div>
  <div id="badge">Potree · Point Cloud</div>
  <nav id="scene-nav"></nav>

  <!-- Potree needs these two divs -->
  <div id="potree_render_area"></div>
  <div id="potree_sidebar_container"></div>

  <!-- Custom UI overlay -->
  <div id="ui">
    <div class="row">
      <span class="lbl">Size</span>
      <input type="range" id="size-slider" min="0.5" max="5" step="0.5" value="0.5">
      <span class="val" id="size-val">0.5</span>
    </div>
    <div class="row">
      <span class="lbl">Budget</span>
      <input type="range" id="budget-slider" min="1" max="10" step="1" value="5">
      <span class="val" id="budget-val">5M</span>
    </div>
    <button id="color-btn">⬡ Elevation mode</button>
    <button id="edl-btn" class="active">⬡ EDL depth</button>
    <button id="reset-btn">⊹ Reset view</button>
  </div>

  <div id="telemetry">
    <div id="fps-line">— fps</div>
    <div id="pts-line"></div>
    <div id="scene-line"></div>
  </div>

<script>
// ── Bilingual strings ───────────────────────────────────────────────────────
const P_STRINGS = {
  en: {
    loading:       'Loading…',
    loadError:     'COPC load error',
    pointCloud:    'Point Cloud',
    scenes:        'Scenes',
    live:          'Live',
    viewing:       '◉ Viewing',
    soon:          '⧗ Soon',
    moreScenes:    '+ More massifs in preparation',
    elevMode:      '⬡ Elevation mode',
    edlDepth:      '⬡ EDL depth',
    resetView:     '⊹ Reset view',
    driftOn:       'Ambient motion on — click to disable',
    driftOff:      'Ambient motion off — click to enable',
    showScenes:    'Show scenes',
    collapseMenu:  'Collapse menu',
  },
  fr: {
    loading:       'Chargement…',
    loadError:     'Erreur de chargement COPC',
    pointCloud:    'Nuage de points',
    scenes:        'Scènes',
    live:          'En ligne',
    viewing:       '◉ En cours',
    soon:          '⧗ Bientôt',
    moreScenes:    '+ D\'autres massifs en préparation',
    elevMode:      '⬡ Mode altitude',
    edlDepth:      '⬡ Profondeur EDL',
    resetView:     '⊹ Vue initiale',
    driftOn:       'Mouvement ambiant activé — cliquer pour désactiver',
    driftOff:      'Mouvement ambiant désactivé — cliquer pour activer',
    showScenes:    'Afficher les scènes',
    collapseMenu:  'Réduire le menu',
  }
};
const _urlLang = new URLSearchParams(location.search).get('lang');
let P_LANG = (_urlLang === 'fr' || _urlLang === 'en') ? _urlLang : 'en';
function PS(key) { return (P_STRINGS[P_LANG] || P_STRINGS.en)[key] || P_STRINGS.en[key] || key; }

function _applyLang() {
  const loadEl = document.getElementById('loading');
  if (loadEl && !loadEl.classList.contains('fade')) loadEl.textContent = PS('loading');
  // badge shows the scene name, not the generic "Point Cloud" label
  // (SCENE_LABEL is already set; only update if it's still the placeholder)
  document.querySelectorAll('#ui button').forEach(btn => {
    if (btn.id === 'color-btn') btn.textContent = PS('elevMode');
    if (btn.id === 'edl-btn')   btn.textContent = PS('edlDepth');
    if (btn.id === 'reset-btn') btn.textContent = PS('resetView');
  });
  if (window.__rebuildSceneMenu) window.__rebuildSceneMenu();
  if (window.__renderDriftToggle3d) window.__renderDriftToggle3d();
}

// Listen for lang change from the parent shell
window.addEventListener('message', e => {
  if (e.data && e.data.type === 'set-lang' && (e.data.lang === 'fr' || e.data.lang === 'en')) {
    P_LANG = e.data.lang;
    _applyLang();
  }
});

// ── Scene config ────────────────────────────────────────────────────────────
// Change SCENE_ID to switch between loaded scenes.
// The folder must exist under ./pointclouds/<SCENE_ID>/metadata.json
// Files: ./pointclouds/<key>.copc.laz  (generated by convert_to_copc.bat)
const SCENES = {
  "2023-11-01-plateau-de-bure-interferometre-detail": {"label": "2023-11-01_Plateau de Bure - Interferometre \u00b7 Detail", "view": {"position": [930529.4, 6396770.81, 2682.14], "target": [930516.51, 6396990.49, 2583.24], "fov": 39.6}},
  "2023-11-01-plateau-de-bure-interferometre-test-detail": {"label": "2023-11-01_Plateau de Bure - Interferometre-test \u00b7 Detail", "view": {"position": [930529.4, 6396770.81, 2682.14], "target": [930516.51, 6396990.49, 2583.24], "fov": 39.6}},
  "2026-03-09-aravis-test-detail": {"label": "2026-03-09_Aravis-test \u00b7 Detail"},
  "2026-02-21-lac-des-milles-vaches-test-detail": {"label": "2026-02-21_Lac des Milles vaches-test \u00b7 Detail", "volume": "cube-001", "view": {"position": [995523.77, 6484486.73, 2490.57], "target": [995393.46, 6484609.56, 2401.51], "fov": 39.6}},
  "2023-09-19-mont-aiguille-2-detail": {"label": "Mont Aiguille \u00b7 Anneau de nuage", "volume": "anneau-de-nuage", "view": {"position": [914880.15, 6422226.87, 1820.77], "target": [901509.26, 6418970.76, 1931.62], "fov": 10.29}},
  "2023-11-10-grande-motte-detail": "2023-11-10_Grande Motte · Detail",
  "2026-03-09-chamechaude-detail": "Chamechaude · Detail",
  "dibona-detail": "Dibona · Albedo x Light",
  "2026-03-28-aiguille-dibona": "2026-03-28_Aiguille Dibona",
  "2026-03-09-chamechaude": "2026-03-09_Chamechaude",
  "chamechaude-full": "Chamechaude HD",
  "chamechaude-lit":  "Chamechaude",
  "grande-motte-lit": "Grande Motte",
  "dibona-web-lit":   "Aiguille Dibona",
  // Volume-only test scene — ring visible without waiting for the full cloud
  "mont-aiguille-volume": {
    label: "Mont Aiguille · Anneau de nuage",
    volume: "anneau-de-nuage",
    nocloud: true,
    // Top-down view: camera directly above ring centre, looking straight down (-Z).
    // Potree uses Z-up so a purely -Z direction sets pitch = -π/2 cleanly.
    // ring bbox: [900342, 6417832, 1674] .. [902304, 6419810, 2597]
    view: {
      position: [901323, 6418821, 6000],
      target:   [901323, 6418821, 2136],
      fov: 55,
    },
  },
  "pont-de-longchaumois": {"label": "Pont de Longchaumois", "view": {"position": [923047.29, 6601032.38, 579.84], "target": [922870.47, 6600796.95, 477.07], "fov": 23.92}},
};

// Entries are either "Label" or { label, view } — view = the scene's 2D
// render framing { position:[x,y,z], target:[x,y,z], fov } in cloud coords
// (written by run_pipeline.py from the .blend scene camera + auto-align).
function sceneLabel(id) {
  const v = SCENES[id];
  return typeof v === "string" ? v : v.label;
}
function sceneView(id) {
  const v = SCENES[id];
  return (v && typeof v === "object" && v.view) ? v.view : null;
}
function sceneNoCloud(id) {
  const v = SCENES[id];
  return !!(v && typeof v === "object" && v.nocloud);
}

// Embed mode (?embed=1) — viewer runs inside the 2D gallery's fullscreen
// iframe: hide the scene menu and badge, the host page provides the chrome
// (← 2D return chip). Everything else (sliders, EDL, volumes) stays.
const isEmbed = !!new URLSearchParams(location.search).get("embed");
if (isEmbed) {
  document.documentElement.classList.add("embed");
  const st = document.createElement("style");
  // In embed mode the gallery provides its own loading overlay — hide ours.
  // Keep the scene menu visible in embed — it's how the visitor hops between
  // 3D scenes without bouncing back to the 2D gallery. The gallery host still
  // owns the loading veil + badge, so those stay hidden.
  // In embed mode the shell's topbar provides the 2D/3D switch — hide ours.
  st.textContent = ".embed #badge, .embed #loading, .embed #dim-switch { display: none !important; }";
  document.head.appendChild(st);
}

function notifyLoaded() {
  if (isEmbed) window.parent.postMessage({ type: 'potree-loaded' }, '*');
}

// Pick scene from URL ?scene=chamechaude, or default to first
const urlScene = new URLSearchParams(location.search).get("scene");
// Default (bare load, no ?scene=) → first published cloud, never a local-only
// test scene. Keep this id in sync with PUBLISHED[0] below.
const DEFAULT_SCENE = "2023-09-19-mont-aiguille-2-detail";
const SCENE_ID = (urlScene && SCENES[urlScene]) ? urlScene : DEFAULT_SCENE;
const SCENE_LABEL = sceneLabel(SCENE_ID);

document.title = SCENE_LABEL + " — " + PS('pointCloud');
document.getElementById("badge").textContent = "Potree · " + SCENE_LABEL;
_applyLang(); // populate loading text, UI buttons
document.getElementById("scene-line").textContent = SCENE_LABEL.toUpperCase();

// ── Scene menu — curated list of published clouds only ──────────────────────
// SCENES (above) holds every cloud we've ever generated, most of them local
// test scenes with no data on the server. The menu shows only what's actually
// published & live, in display order, with a name + subtitle. Add a scene here
// once its .copc.laz is deployed under ./pointclouds/.
const PUBLISHED = [
  { id: "pont-de-longchaumois",                           name: "Pont de Longchaumois", sub: "La Bienne, Jura" },
  { id: "2023-09-19-mont-aiguille-2-detail",              name: "Mont Aiguille",   sub: "Anneau de nuage" },
  { id: "2026-03-09-chamechaude-detail",                  name: "Chamechaude",     sub: "Massif de la Chartreuse" },
  { id: "2023-11-01-plateau-de-bure-interferometre-detail", name: "Plateau de Bure", sub: "Interféromètre IRAM" },
];
const SOON_COUNT      = 3;                       // ghost "soon" rows shown below
const MENU_PREF_KEY   = "lidar-scene-menu-collapsed";
const SOON_BAR_WIDTHS = ["64%", "48%", "56%", "52%", "60%"];

function _buildSceneMenuHTML() {
  const pill = document.getElementById("scene-pill") || document.createElement("button");
  pill.id = "scene-pill";
  pill.setAttribute("aria-label", PS('showScenes'));
  pill.innerHTML = '<span style="font-size:11px;line-height:1">▾</span> ' + PS('scenes') + ' ' +
                   '<span class="ct">' + PUBLISHED.length + '</span>';

  const panel = document.getElementById("scene-panel") || document.createElement("div");
  panel.id = "scene-panel";

  let html = '<div class="sm-head">' +
               '<span class="lbl">Point clouds</span>' +
               '<span class="cnt"><b>' + PUBLISHED.length + '</b> ' + PS('live') + '</span>' +
               '<button class="sm-close" aria-label="' + PS('collapseMenu') + '">✕</button>' +
             '</div>';

  PUBLISHED.forEach((s, i) => {
    const idx     = String(i + 1).padStart(2, "0");
    const current = s.id === SCENE_ID;
    html += '<button class="sm-row' + (current ? " current" : "") + '"' +
              ' data-scene="' + s.id + '"' + (current ? " disabled" : "") + '>' +
              '<span class="sm-idx">' + idx + '</span>' +
              '<span><span class="sm-name">' + s.name + '</span>' +
              '<span class="sm-sub">' + s.sub + '</span></span>' +
              '<span class="sm-tag">' + (current ? PS('viewing') : "→") + '</span>' +
            '</button>';
  });

  if (SOON_COUNT > 0) {
    html += '<div class="sm-divider"></div>';
    for (let i = 0; i < SOON_COUNT; i++) {
      const idx = String(PUBLISHED.length + i + 1).padStart(2, "0");
      const w   = SOON_BAR_WIDTHS[i % SOON_BAR_WIDTHS.length];
      html += '<div class="sm-soon">' +
                '<span class="sm-idx">' + idx + '</span>' +

// ── Color space ──────────────────────────────────────────────────────────────
// Our baked colors are already sRGB-encoded uint8.
// Potree's shader passes them through without transformation.
// We want NO extra gamma at the renderer output — the browser/OS will
// interpret the framebuffer values as sRGB natively, which is correct.
const r = viewer.renderer;
r.setClearColor(0x030405, 1);
if (typeof THREE !== "undefined") {

  } else if (r.outputEncoding !== undefined) {

let useVertexColor = true;
let edlEnabled = true;

// ── Fix: CopcLoader.load is async but Potree never .catch()es it.
//    Any error from Copc.create() (bad VLR, network, range request) silently
//    rejects an unhandled promise — callback never fires, no console error.
//    Patch it here to surface failures.
if (Potree.CopcLoader) {
  const _origCopcLoad = Potree.CopcLoader.load;
  Potree.CopcLoader.load = async function(file, callback) {
    try {
      await _origCopcLoad.call(this, file, callback);
    } catch (err) {
      console.error("[CopcLoader] Failed to load:", file, "\n", err);
      document.getElementById("loading").innerHTML =
        "COPC load error<br><small style='opacity:.5;font-size:9px'>" +
        (err && err.message ? err.message : String(err)) + "</small>";
      callback(null);  // let the caller handle null geometry
    }
  };
}

// Also catch any other unhandled async rejections (fallback)
window.addEventListener("unhandledrejection", (ev) => {
  console.error("[unhandledrejection]", ev.reason);
  const msg = ev.reason && ev.reason.message ? ev.reason.message : String(ev.reason);
  const el = document.getElementById("loading");
  if (el && el.style.display !== "none") {
    el.innerHTML = "Error: " + msg +
      "<br><small style='opacity:.4;font-size:9px'>open DevTools console for details</small>";
  }
});

// URL param ?test=1 → load Potree's bundled lion sample instead (for debugging)
const urlTest = new URLSearchParams(location.search).get("test");
// Cache-buster: bump when a .copc.laz is rebuilt under the same name —
// Chrome caches range-request chunks even across hard refreshes.
const CLOUD_VERSION = "34";
const CLOUD_URL = urlTest
  ? "./Potree_1.8.2/pointclouds/lion_takanawa.copc.laz"
  : `./pointclouds/${SCENE_ID}.copc.laz?v=${CLOUD_VERSION}`;
const CLOUD_LABEL = urlTest ? "lion (test)" : SCENE_LABEL;
console.log("[Potree] Loading:", CLOUD_URL);

// ── Cloud-ring preload ──────────────────────────────────────────────────────
// Kick the ring's volume fetches off NOW, before Potree's heavy COPC range
// requests below saturate the connection pool. initVolume() (far below) awaits
// these promises instead of fetching.
//
// The raw .bin is huge (~238 MB) and must download IN FULL before the ring can
// render — online that always loses the race to the point cloud (which streams
// progressively via Range requests). The .bin is extremely sparse though, so we
// ship a gzip of it (~1.3 MB, ~180×) and inflate it in-browser. Falls back to
// the raw .bin if the .gz is missing or DecompressionStream is unsupported.
async function _fetchVolumeBuf(id) {
  const base = `volumes/${id}`;
  if (typeof DecompressionStream === 'function') {
    try {
      const r = await fetch(`${base}.bin.gz?v=${CLOUD_VERSION}`, { priority: 'high' });
      if (r.ok && r.body) {
        const stream = r.body.pipeThrough(new DecompressionStream('gzip'));
        return await new Response(stream).arrayBuffer();
      }
    } catch (e) { console.warn('[Volume] .gz path failed, falling back to .bin:', e); }
  }
  return (await fetch(`${base}.bin?v=${CLOUD_VERSION}`, { priority: 'high' })).arrayBuffer();
}
const _volId = sceneVolume(SCENE_ID);
const _volPreload = _volId ? {
  id:   _volId,
  meta: fetch(`volumes/${_volId}.json?v=${CLOUD_VERSION}`, { priority: 'high' }).then(r => r.json()),
  buf:  _fetchVolumeBuf(_volId),
} : null;

if (sceneNoCloud(SCENE_ID)) {
  // Volume-only scene — no point cloud, fade loading immediately then set view
  const loadEl = document.getElementById("loading");
  loadEl.classList.add("fade");
  setTimeout(() => { loadEl.style.display = "none"; }, 700);
  notifyLoaded();
  document.getElementById("ui").classList.add("visible");
  document.getElementById("telemetry").classList.add("visible");
  document.getElementById("pts-line").textContent = "volume only";
  // Defer view setup so Potree's renderer has a chance to init
  setTimeout(() => {
    try {
      applyDefaultView();
      setTimeout(captureHomeView, 1500);
    } catch(err) {
      console.warn("[nocloud] applyDefaultView failed:", err);
    }
    // Custom orbit for volume-only scenes — both EarthControls and OrbitControls
    // do a raycast pick on every click and reset the pivot when they find nothing,
    // sending the camera into the volume. Instead, we capture all pointer/wheel
    // events before Potree sees them and modify view.yaw/pitch/radius directly.
    const canvas = viewer.renderer.domElement;
    const view   = viewer.scene.view;
    let _drag = { active: false, button: 0, lastX: 0, lastY: 0 };
    const ORBIT_SPEED = 0.004;
    const PAN_SPEED   = 0.0003;   // fraction of radius per pixel
    const ZOOM_SPEED  = 0.0012;

    function _eat(e) { e.stopPropagation(); e.preventDefault(); }

    canvas.addEventListener('contextmenu', _eat, true);

    canvas.addEventListener('mousedown', e => {
      _eat(e);
      _drag.active = true;
      _drag.button = e.button;
      _drag.lastX  = e.clientX;
      _drag.lastY  = e.clientY;
    }, true);

    window.addEventListener('mousemove', e => {
      if (!_drag.active) return;
      const dx = e.clientX - _drag.lastX;
      const dy = e.clientY - _drag.lastY;
      _drag.lastX = e.clientX;
      _drag.lastY = e.clientY;
      if (_drag.button === 0) {
        // Left drag → orbit
        view.yaw   -= dx * ORBIT_SPEED;
        view.pitch  = Math.max(-Math.PI / 2 + 0.05,
                        Math.min(-0.05, view.pitch - dy * ORBIT_SPEED));
      } else if (_drag.button === 2) {
        // Right drag → pan (translate the pivot in the view plane)
        const yaw = view.yaw;
        const pan = view.radius * PAN_SPEED;
        view.position.x += (-Math.cos(yaw) * dx + Math.sin(yaw) * dy) * pan;
        view.position.y += (-Math.sin(yaw) * dx - Math.cos(yaw) * dy) * pan;
      }
    }, true);

    window.addEventListener('mouseup', () => { _drag.active = false; }, true);

    canvas.addEventListener('wheel', e => {
      _eat(e);
      const factor = Math.exp(e.deltaY * ZOOM_SPEED);
      view.radius  = Math.max(100, Math.min(30000, view.radius * factor));
    }, { passive: false, capture: true });

    initTouchControls();
  }, 100);
} else {
  Potree.loadPointCloud(
    CLOUD_URL,
    CLOUD_LABEL,
    (e) => {
      pointcloud = e.pointcloud;
      const mat = pointcloud.material;

      // --- Appearance ---
      mat.size          = 0.5;
      mat.pointSizeType = Potree.PointSizeType.FIXED;
      mat.shape         = Potree.PointShape.SQUARE;

      // Use baked vertex colors
      setVertexColorMode();

      viewer.scene.addPointCloud(pointcloud);
      applyDefaultView();
      setTimeout(captureHomeView, 1500);

      // Point count
      const npts = pointcloud.numPoints || 0;
      if (npts > 0) {
        document.getElementById("pts-line").textContent =
          (npts / 1e6).toFixed(1) + "M pts";
      }

      // Hide loading overlay — but only once points are actually on screen.
      // This callback fires when the COPC *root* is parsed; the octree nodes
      // still stream in for several seconds afterwards. Revealing now shows a
      // black scene (and in embed mode lifts the gallery's host veil early via
      // notifyLoaded). Instead poll until enough visible points have rendered,
      // with a hard timeout so it can never hang.
      const loadEl = document.getElementById("loading");
      let _revealed = false;
      const _t0 = performance.now();
      function _reveal() {
        if (_revealed) return;
        _revealed = true;
        loadEl.classList.add("fade");
        setTimeout(() => { loadEl.style.display = "none"; }, 700);
        notifyLoaded();
      }
      function _waitForPoints() {
        if (_revealed) return;
        let loaded = 0;
        const vn = pointcloud.visibleNodes || [];
        for (const n of vn) loaded += (n.getNumPoints ? n.getNumPoints() : (n.numPoints || 0));
        if (loaded > 120000 || performance.now() - _t0 > 8000) _reveal();
        else requestAnimationFrame(_waitForPoints);
      }
      requestAnimationFrame(_waitForPoints);

      document.getElementById("ui").classList.add("visible");
      document.getElementById("telemetry").classList.add("visible");

      initTouchControls();
    }
  );
}

// ── Mobile touch controls ─────────────────────────────────────────────────────
// Potree's EarthControls is mouse-only — no pan, sluggish pinch on mobile.
// We intercept all touch events before Potree sees them and drive the view
// directly: 1 finger = orbit, 2 fingers = pinch-zoom + pan.
function initTouchControls() {
  const canvas = viewer.renderer.domElement;
  const view   = viewer.scene.view;

  const ORBIT_SPEED = 0.006;
  const PAN_SPEED   = 0.0012;
  const ZOOM_SPEED  = 0.010;   // pinch sensitivity — full pinch ≈ 10x zoom

  let _t = {};   // active touches keyed by identifier

  function _eat(e) { e.stopPropagation(); e.preventDefault(); }

  function _midpoint(a, b) {
    return { x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 };
  }
  function _dist(a, b) {
    const dx = a.clientX - b.clientX, dy = a.clientY - b.clientY;
    return Math.sqrt(dx*dx + dy*dy);
  }

  // Re-place the camera so it keeps looking at `pivot` from the current
  // yaw/pitch/radius. Without this, changing yaw/pitch spins the camera in
  // place instead of orbiting around the object.
  function _reanchor(pivot) {
    const dir = view.direction.clone().multiplyScalar(-view.radius);
    view.position.copy(pivot).add(dir);
  }

  canvas.addEventListener('touchstart', e => {
    _eat(e);
    for (const t of e.changedTouches) _t[t.identifier] = { clientX: t.clientX, clientY: t.clientY };
  }, { passive: false, capture: true });

  canvas.addEventListener('touchmove', e => {
    _eat(e);
    const ids = Object.keys(_t);
    const cur = {};
    for (const t of e.changedTouches) cur[t.identifier] = t;

    if (ids.length === 1) {
      // Single finger → orbit around the pivot
      const id = ids[0];
      const prev = _t[id];
      const next = cur[id] || prev;
      const dx = next.clientX - prev.clientX;
      const dy = next.clientY - prev.clientY;
      const pivot = view.getPivot();
      view.yaw   -= dx * ORBIT_SPEED;
      view.pitch  = Math.max(-Math.PI / 2 + 0.05,
                    Math.min(-0.05, view.pitch - dy * ORBIT_SPEED));
      _reanchor(pivot);
      _t[id] = { clientX: next.clientX, clientY: next.clientY };

    } else if (ids.length === 2) {
      // Two fingers → pinch-zoom toward pivot + pan
      const [id0, id1] = ids;
      const p0prev = _t[id0], p1prev = _t[id1];
      const p0cur  = cur[id0] || p0prev;
      const p1cur  = cur[id1] || p1prev;

      const pivot = view.getPivot();

      // Pinch zoom — move the camera toward/away from the pivot
      const prevDist = _dist(p0prev, p1prev);
      const curDist  = _dist(p0cur,  p1cur);
      if (prevDist > 1 && Math.abs(curDist - prevDist) > 0.5) {
        const factor = Math.exp((prevDist - curDist) * ZOOM_SPEED);
        view.radius = Math.max(50, Math.min(50000, view.radius * factor));
      }

      // Pan — translate the pivot (and camera with it) in the ground plane
      const prevMid = _midpoint(p0prev, p1prev);
      const curMid  = _midpoint(p0cur,  p1cur);
      const dx = curMid.x - prevMid.x;
      const dy = curMid.y - prevMid.y;
      const yaw = view.yaw;
      const pan = view.radius * PAN_SPEED;
      pivot.x += (-Math.cos(yaw) * dx + Math.sin(yaw) * dy) * pan;
      pivot.y += (-Math.sin(yaw) * dx - Math.cos(yaw) * dy) * pan;

      _reanchor(pivot);

      _t[id0] = { clientX: p0cur.clientX, clientY: p0cur.clientY };
      _t[id1] = { clientX: p1cur.clientX, clientY: p1cur.clientY };
    }
  }, { passive: false, capture: true });

  canvas.addEventListener('touchend', e => {
    _eat(e);
    for (const t of e.changedTouches) delete _t[t.identifier];
  }, { passive: false, capture: true });

  canvas.addEventListener('touchcancel', e => {
    _eat(e);
    _t = {};
  }, { passive: false, capture: true });
}

// ── Idle drift ───────────────────────────────────────────────────────────────
// After 2 s without interaction, slowly orbit the camera clockwise around the
// pivot — same motion as a gentle circular mouse drag. Eases in over a few
// seconds so the start is imperceptible. Only a deliberate control input
// (click/drag, scroll, key) stops it — bare mouse movement does NOT, so the
// drift keeps going while the cursor just hovers or moves over the scene.
const IDLE_DELAY_MS  = 2000;
const DRIFT_EASE_MS  = 4000;     // ramp-up duration after the idle delay
const DRIFT_YAW_RPS  = 0.020;    // rad/s — full turn in ~5.2 min
const DRIFT_BOB_AMP  = 0.008;    // rad — subtle pitch bob echoing the circle
const DRIFT_BOB_HZ   = 0.05;     // bob cycles per second

const DRIFT_PREF_KEY = 'lidar-drift-off';   // shared with the 2D viewer (same origin)
function _driftDisabled() { try { return localStorage.getItem(DRIFT_PREF_KEY) === '1'; } catch (e) { return false; } }

let _lastInteract = performance.now();
function _markInteract() { _lastInteract = performance.now(); }
// Note: 'mousemove' / 'touchmove' are intentionally excluded — moving the
// cursor should not interrupt the drift; only a press/scroll/key does.
['mousedown', 'wheel', 'touchstart', 'keydown']
  .forEach(t => window.addEventListener(t, _markInteract, { capture: true, passive: true }));

let _driftPrevT = performance.now();
(function driftLoop() {
  requestAnimationFrame(driftLoop);
  const now = performance.now();
  const dt  = Math.min(0.1, (now - _driftPrevT) / 1000);
  _driftPrevT = now;

  const idleFor = now - _lastInteract;
  if (idleFor < IDLE_DELAY_MS || !viewer.scene || _driftDisabled()) return;

  const k = Math.min(1, (idleFor - IDLE_DELAY_MS) / DRIFT_EASE_MS);  // ease-in
  const view  = viewer.scene.view;
  const pivot = view.getPivot();

  view.yaw  -= DRIFT_YAW_RPS * k * dt;
  view.pitch = Math.max(-Math.PI / 2 + 0.05, Math.min(-0.05,
    view.pitch + Math.cos(now / 1000 * DRIFT_BOB_HZ * 2 * Math.PI)
               * DRIFT_BOB_AMP * k * dt));

  // keep looking at the pivot — orbit, not spin-in-place
  const dir = view.direction.clone().multiplyScalar(-view.radius);
  view.position.copy(pivot).add(dir);
})();

// ── Discreet motion on/off toggle ────────────────────────────────────────────
// Disables the idle drift entirely. Preference is shared with the 2D viewer via
// localStorage (same origin), so toggling here also affects the 2D drift.
(function () {
  const css = document.createElement('style');
  css.textContent = `
    #drift-toggle {
      position: fixed; right: 24px; bottom: 80px; z-index: 100000;
      width: 30px; height: 30px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: rgba(8,12,16,.45); border: 1px solid rgba(255,255,255,.14);
      color: rgba(255,255,255,.55); font-size: 11px; line-height: 1;
      cursor: pointer; opacity: .35; transition: opacity .2s, color .2s, border-color .2s;
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); user-select: none;
    }
    #drift-toggle:hover { opacity: 1; color: #c8f0e0; border-color: rgba(200,240,224,.5); }
    @media (max-width: 767px) { #drift-toggle { right: 12px; bottom: 12px; } }
  `;
  document.head.appendChild(css);

  const btn = document.createElement('button');
  btn.id = 'drift-toggle';
  document.body.appendChild(btn);

  function render() {
    const off = _driftDisabled();
    btn.textContent = off ? '▶' : '❙❙';
    btn.title = PS(off ? 'driftOff' : 'driftOn');
    btn.setAttribute('aria-label', btn.title);
  }
  window.__renderDriftToggle3d = render;
  btn.addEventListener('click', e => {
    e.stopPropagation();
    const off = !_driftDisabled();
    try { localStorage.setItem(DRIFT_PREF_KEY, off ? '1' : '0'); } catch (err) {}
    render();
  });
  render();
})();

// ── Default view — the scene's 2D render framing when available ─────────────
let _homeView = null;   // captured after the initial framing

function applyDefaultView() {
  const v = sceneView(SCENE_ID);
  if (v) {
    viewer.scene.view.position.set(v.position[0], v.position[1], v.position[2]);
    viewer.scene.view.lookAt(new THREE.Vector3(v.target[0], v.target[1], v.target[2]));
    if (v.fov) viewer.setFOV(v.fov);
  } else if (_homeView) {
    // restore the exact framing captured after load — fitToScreen alone is
    // unreliable once the user has orbited (stale pivot)
    viewer.scene.view.position.copy(_homeView.position);
    viewer.scene.view.lookAt(_homeView.target.clone());
  } else {
    viewer.fitToScreen(0.6);
  }
}

function captureHomeView() {
  _homeView = {
    position: viewer.scene.view.position.clone(),
    target:   viewer.scene.view.getPivot().clone(),
  };
}

// ── Color modes ──────────────────────────────────────────────────────────────
function setVertexColorMode() {
  if (!pointcloud) return;
  const mat = pointcloud.material;
  // "rgba" uses the RGB colors baked into the point cloud
  mat.activeAttributeName = "rgba";
}

function setElevationMode() {
  if (!pointcloud) return;
  const mat = pointcloud.material;
  mat.activeAttributeName = "elevation";

  // Use Viridis palette matching the Three.js prototype viewer
  // Potree gradient: array of [t, THREE.Color] pairs, t in [0..1]
  if (Potree.Gradients && Potree.Gradients.VIRIDIS) {
    mat.gradient = Potree.Gradients.VIRIDIS;
  } else {
    // Manual Viridis approximation (matches prototype/main.js shader)
    mat.gradient = [
      [0.000, new THREE.Color(0x440154)],
      [0.125, new THREE.Color(0x482878)],
      [0.250, new THREE.Color(0x3e4989)],
      [0.375, new THREE.Color(0x31688e)],
      [0.500, new THREE.Color(0x26828e)],
      [0.625, new THREE.Color(0x1f9e89)],
      [0.750, new THREE.Color(0x35b779)],
      [0.875, new THREE.Color(0x6ece58)],
      [1.000, new THREE.Color(0xfde725)],
    ];
  }
}

});

// ── Volumetric overlay — ray-marched 3D texture over the point cloud ────────
// Loads potree/volumes/<id>.bin (RGBA8: rgb=lit radiance, a=extinction) +
// <id>.json (lambert bbox). Marches per pixel, occluded by the point cloud
// via the EDL pass depth texture (EDL must be ON — it is by default).
// Volume id comes from the scene entry { volume: "anneau" } or ?vol= param.
function sceneVolume(id) {
  const v = SCENES[id];
  const urlVol = new URLSearchParams(location.search).get("vol");
  return urlVol || ((v && typeof v === "object" && v.volume) ? v.volume : null);
}

// WebGL 1 / GLSL ES 1.0 compatible shaders.
// 3D volume is packed as a 2D atlas (NZ slices tiled into a single texture).
const VOL_VERT = `
attribute vec3 position;
void main() { gl_Position = vec4(position.xy, 0.999, 1.0); }
`;

const VOL_FRAG = `
precision highp float;
uniform sampler2D uVol;
uniform sampler2D uDepth;
uniform vec3 uBoxMin, uBoxMax, uCamPos;
uniform mat4 uInvVP;
uniform vec2 uResolution;
uniform float uRgbMax, uSigmaMax, uGain, uRgbSqrt;
uniform float uNZ, uNCOLS, uNROWS;
uniform vec2 uHalfTexel;

vec2 sliceUV(vec3 tc, float sliceIdx) {
  float col = mod(sliceIdx, uNCOLS);
  float row = floor(sliceIdx / uNCOLS);
  // clamp half a texel inside the tile so linear filtering never bleeds
  // into the neighbouring slice of the atlas
  vec2 xy = clamp(tc.xy, uHalfTexel, 1.0 - uHalfTexel);
  return (vec2(col, row) + xy) / vec2(uNCOLS, uNROWS);
}
vec4 sampleVol(vec3 tc) {
  float z  = tc.z * uNZ;
  float z0 = floor(z);
  float z1 = min(z0 + 1.0, uNZ - 1.0);
  return mix(texture2D(uVol, sliceUV(tc, z0)),
             texture2D(uVol, sliceUV(tc, z1)), z - z0);
}

vec3 unproject(vec2 ndcXY, float ndcZ) {
  vec4 p = uInvVP * vec4(ndcXY, ndcZ, 1.0);
  return p.xyz / p.w;
}

void main() {
  vec2 uv  = gl_FragCoord.xy / uResolution;
  vec2 ndc = uv * 2.0 - 1.0;
  vec3 p0  = unproject(ndc, -1.0);
  vec3 p1  = unproject(ndc,  1.0);
  vec3 dir = normalize(p1 - p0);

  vec3 inv   = 1.0 / dir;
  vec3 tA    = (uBoxMin - uCamPos) * inv;
  vec3 tB    = (uBoxMax - uCamPos) * inv;
  vec3 tMin3 = min(tA, tB), tMax3 = max(tA, tB);
  float t0   = max(max(tMin3.x, tMin3.y), tMin3.z);
  float t1   = min(min(tMax3.x, tMax3.y), tMax3.z);
  t0 = max(t0, 0.0);
  if (t0 >= t1) discard;

  float d = texture2D(uDepth, uv).r;
  if (d < 1.0) {
    vec3 scenePos = unproject(ndc, d * 2.0 - 1.0);
    t1 = min(t1, distance(scenePos, uCamPos));
    if (t0 >= t1) discard;
  }

  const int STEPS = 192;
  float dt = (t1 - t0) / float(STEPS);
  vec3  C  = vec3(0.0);
  float T  = 1.0;
  for (int i = 0; i < STEPS; i++) {
    float t  = t0 + (float(i) + 0.5) * dt;
    vec3  p  = uCamPos + dir * t;
    vec3  tc = (p - uBoxMin) / (uBoxMax - uBoxMin);
    vec4  s  = sampleVol(tc);
    float sigma = s.a * uSigmaMax;
    if (sigma > 0.000001) {
      float a = 1.0 - exp(-sigma * dt);
      // sqrt-encoded volumes (meta encoding:"sqrt") store sqrt(rgb) — square back
      vec3 rgb = mix(s.rgb, s.rgb * s.rgb, uRgbSqrt);
      C += T * a * rgb * uRgbMax * uGain;
      T *= (1.0 - a);
      if (T < 0.01) break;
    }
  }
  if (T > 0.999) discard;
  C = pow(clamp(C, 0.0, 1.0), vec3(1.0 / 2.2));
  gl_FragColor = vec4(C, 1.0 - T);
}
`;

let _vol = null;
async function initVolume(preload) {
  const volId = preload.id;
  try {
    // Bytes were already requested at page top (see _volPreload) — just await them.
    const meta = await preload.meta;
    const buf  = await preload.buf;
    const [NX, NY, NZ] = meta.shape;

    // Pack NZ slices into a 2D atlas — WebGL 1 has no sampler3D
    const NCOLS  = Math.ceil(Math.sqrt(NZ));
    const NROWS  = Math.ceil(NZ / NCOLS);
    const atlasW = NX * NCOLS;
    const atlasH = NY * NROWS;
    const src    = new Uint8Array(buf);
    const atlas  = new Uint8Array(atlasW * atlasH * 4);
    for (let z = 0; z < NZ; z++) {
      const col = z % NCOLS;
      const row = Math.floor(z / NCOLS);
      for (let y = 0; y < NY; y++) {
        const srcOff = (z * NY * NX + y * NX) * 4;
        const dstOff = ((row * NY + y) * atlasW + col * NX) * 4;
        atlas.set(src.subarray(srcOff, srcOff + NX * 4), dstOff);
      }
    }

    const tex = new THREE.DataTexture(atlas, atlasW, atlasH,
                                      THREE.RGBAFormat, THREE.UnsignedByteType);
    tex.minFilter    = THREE.LinearFilter;
    tex.magFilter    = THREE.LinearFilter;
    tex.generateMipmaps = false;
    tex.unpackAlignment = 1;
    tex.needsUpdate  = true;

    const mat = new THREE.RawShaderMaterial({
      vertexShader:  VOL_VERT,
      fragmentShader: VOL_FRAG,
      uniforms: {
        uVol:        { value: tex },
        uDepth:      { value: null },
        uBoxMin:     { value: new THREE.Vector3(...meta.min) },
        uBoxMax:     { value: new THREE.Vector3(...meta.max) },
        uCamPos:     { value: new THREE.Vector3() },
        uInvVP:      { value: new THREE.Matrix4() },
        uResolution: { value: new THREE.Vector2() },
        uRgbMax:     { value: meta.rgb_max },
        uSigmaMax:   { value: meta.sigma_max },
        uGain:       { value: 1.0 },
        uRgbSqrt:    { value: meta.encoding === "sqrt" ? 1.0 : 0.0 },
        uNZ:         { value: NZ },
        uNCOLS:      { value: NCOLS },
        uNROWS:      { value: NROWS },
        uHalfTexel:  { value: new THREE.Vector2(0.5 / NX, 0.5 / NY) },
      },
      transparent: true,
      depthTest:  false,
      depthWrite: false,
      blending:   THREE.CustomBlending,
      blendSrc:   THREE.OneFactor,
      blendDst:   THREE.OneMinusSrcAlphaFactor,
    });

    // Fullscreen triangle — simpler and faster than a quad
    const geom = new THREE.BufferGeometry();
    const pos  = new THREE.BufferAttribute(
      new Float32Array([-1,-1,0, 3,-1,0, -1,3,0]), 3);
    if (geom.setAttribute) geom.setAttribute('position', pos);
    else                    geom.addAttribute('position', pos);
    const quad = new THREE.Mesh(geom, mat);
    quad.frustumCulled = false;
    const scene = new THREE.Scene();
    scene.add(quad);
    _vol = { mat, scene, cam: new THREE.Camera(),
             boxMin: meta.min, boxMax: meta.max };
    console.log(`[Volume] loaded ${volId} ${NX}x${NY}x${NZ} → atlas ${atlasW}x${atlasH} (${NCOLS}×${NROWS})`);

    // Draw after Potree's own render each frame
    const origRender = viewer.render.bind(viewer);
    viewer.render = function () {
      origRender();
      renderVolumePass();
    };
  } catch (err) {
    console.error("[Volume] failed to load:", volId, err);
  }
}

const _m4 = (typeof THREE !== "undefined") ? new THREE.Matrix4() : null;
// 1×1 white depth texture used when there is no point cloud (depth = 1.0 = far plane = no occlusion)
let _dummyDepth = null;
function _getDummyDepth() {
  if (_dummyDepth) return _dummyDepth;
  _dummyDepth = new THREE.DataTexture(new Uint8Array([255]), 1, 1, THREE.RedFormat, THREE.UnsignedByteType);
  _dummyDepth.needsUpdate = true;
  return _dummyDepth;
}
function renderVolumePass() {
  if (!_vol) return;
  const depthTex = (viewer.edlRenderer && viewer.edlRenderer.rtEDL)
    ? viewer.edlRenderer.rtEDL.depthTexture : null;
  const useDepth = depthTex || _getDummyDepth();  // fallback: no occlusion
  const cam = viewer.scene.getActiveCamera();
  const r = viewer.renderer;
  const size = r.getDrawingBufferSize(new THREE.Vector2());
  const u = _vol.mat.uniforms;
  u.uDepth.value = useDepth;
  // All shader math is camera-relative: Lambert-93 coords (~6.4e6) destroy
  // float32 precision in the GPU (blocky sampling + jitter while moving).
  // Subtractions happen here in JS float64; the shader only sees small values.
  const cp = cam.position;
  u.uCamPos.value.set(0, 0, 0);
  u.uBoxMin.value.set(_vol.boxMin[0] - cp.x, _vol.boxMin[1] - cp.y, _vol.boxMin[2] - cp.z);
  u.uBoxMax.value.set(_vol.boxMax[0] - cp.x, _vol.boxMax[1] - cp.y, _vol.boxMax[2] - cp.z);
  _m4.copy(cam.matrixWorldInverse);
  _m4.elements[12] = _m4.elements[13] = _m4.elements[14] = 0;  // drop view translation
  _m4.premultiply(cam.projectionMatrix);
  const inv = u.uInvVP.value.copy(_m4);
  if (typeof inv.invert === "function") inv.invert();
  else inv.getInverse(_m4);            // three < r123 API
  u.uResolution.value.copy(size);
  const oldAutoClear = r.autoClear;
  r.autoClear = false;
  r.render(_vol.scene, _vol.cam);
  r.autoClear = oldAutoClear;
}

if (_volPreload) initVolume(_volPreload);

// ── FPS counter ───────────────────────────────────────────────────────────────
let frames = 0, fpsT = performance.now();
const fpsEl = document.getElementById("fps-line");
(function loop() {
  requestAnimationFrame(loop);
  frames++;
  const now = performance.now();
  if (now - fpsT >= 1000) {
    fpsEl.textContent = frames + " fps";
    frames = 0;
    fpsT = now;
  }
})();

// ── Keyboard shortcuts ────────────────────────────────────────────────────────
window.addEventListener("keydown", e => {
  if (e.key === "r" || e.key === "R") applyDefaultView();
  if (e.key === "e" || e.key === "E") document.getElementById("edl-btn").click();
  if (e.key === "c" || e.key === "C") document.getElementById("color-btn").click();
});
</script>
</body>
</html>
